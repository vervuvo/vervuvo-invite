<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You've been challenged · Vervuvo</title>
  <meta name="description" content="Accept the duel challenge on Vervuvo." />
  <!-- Open Graph so the link shows a rich preview when shared -->
  <meta property="og:title" content="⚔️ You've been challenged on Vervuvo" />
  <meta property="og:description" content="Tap to accept the duel." />
  <meta property="og:type" content="website" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0e1216; color: #fff; padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center;
      background: #161b22; border: 1px solid #232a33; border-radius: 20px; padding: 32px 24px;
    }
    .emoji { font-size: 52px; margin-bottom: 8px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #9aa7b4; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
    .title { color: #1f98cc; font-weight: 700; }
    .btn {
      display: block; width: 100%; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 700;
      text-decoration: none; margin-bottom: 12px; border: none; cursor: pointer;
    }
    .btn-primary { background: #1f98cc; color: #fff; }
    .btn-store { background: #232a33; color: #fff; border: 1px solid #2e3742; }
    .hint { color: #5b6671; font-size: 12px; margin: 16px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">⚔️</div>
    <h1>You've been challenged!</h1>
    <p id="subtitle">Someone challenged you to a duel on Vervuvo. <span class="title" id="duel-title"></span></p>

    <!-- Universal/App Link: if the app is installed, the OS opens it before this
         page ever loads. This button is the explicit "open app" fallback. -->
    <a class="btn btn-primary" id="open-app" href="#">Open in Vervuvo</a>
    <a class="btn btn-store" id="app-store" href="https://apps.apple.com/app/id6760433768">Download on the App Store</a>
    <a class="btn btn-store" id="play-store" href="https://play.google.com/store/apps/details?id=com.vervuvo.app">Get it on Google Play</a>

    <p class="hint">After installing, reopen this link to accept the challenge.</p>
  </div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    // Anon key is the public client key (already shipped in the app), safe to embed.
    // Fill these in to show the real duel title/category on the page. Optional —
    // the page works without them.
    var SUPABASE_URL = "https://fdczpqjfjiwpiosxadob.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_EZ8VOnww2KKEFXl3lD7lUw_zNHXlX8b";

    // Duel id is the last path segment: /duel/<id>
    var parts = location.pathname.split("/").filter(Boolean);
    var duelId = parts[parts.length - 1];

    // The custom scheme deep-links straight into a logged-in app even when
    // universal links don't fire (e.g. when navigated from another app's webview).
    document.getElementById("open-app").setAttribute("href", "vervuvo://duel/" + duelId);

    // Hide any store button whose URL hasn't been filled in yet (e.g. the App
    // Store listing before launch) so the page never shows a dead link.
    ["app-store", "play-store"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el && el.getAttribute("href").indexOf("REPLACE_") !== -1) el.style.display = "none";
    });

    // Best-effort fetch of public duel info to personalize the page. Uses the
    // get_public_duel RPC (SECURITY DEFINER) which exposes only safe display
    // fields to the anon key — the duels table itself is not anon-readable.
    if (SUPABASE_URL.indexOf("REPLACE_") === -1 && duelId) {
      fetch(SUPABASE_URL + "/rest/v1/rpc/get_public_duel", {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ p_duel_id: duelId })
      })
        .then(function (r) { return r.json(); })
        .then(function (rows) {
          var d = rows && rows[0];
          if (!d) return;
          if (d.status !== "pending") {
            document.getElementById("subtitle").textContent = "This challenge is no longer available.";
            return;
          }
          var label = d.subcategory || d.category || "";
          document.getElementById("duel-title").textContent = label ? (label + (d.duration ? " · " + d.duration + "s" : "")) : "";
        })
        .catch(function () { /* non-fatal */ });
    }
  </script>
</body>
</html>
